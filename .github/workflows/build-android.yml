name: Campus Orbit - Build Android APK

on:
  workflow_dispatch:
    inputs:
      api_base:
        description: 'Alamat API yang dapat dijangkau HP Android (bukan localhost)'
        required: true
        default: 'http://192.168.100.8:3100/api/v1'
        type: string

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true

      - name: Check Flutter environment
        run: flutter doctor -v

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze Dart source
        run: flutter analyze --no-fatal-infos

      - name: Build debug APK
        env:
          API_BASE: ${{ inputs.api_base }}
        run: flutter build apk --debug --dart-define="API_BASE=$API_BASE"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: campus-orbit-debug-apk
          path: apps/mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
